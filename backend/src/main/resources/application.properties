# ===================================================
# 01Blog - Application Configuration
# ===================================================

# Server Port
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------
# Database Connection (PostgreSQL)
# ---------------------------------------------------
# Loaded from environment (.env file)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------
# JPA & Hibernate Settings
# ---------------------------------------------------
# 'update' automatically creates/updates database tables from our Java entities.
# This saves us from writing manual SQL table creation scripts!
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in the console so we can see what Hibernate is doing
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Database dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Ensure Jackson serializes JSON dates in UTC
spring.jackson.time-zone=UTC

# ---------------------------------------------------
# JWT (Security Token) Settings
# ---------------------------------------------------
# Loaded from environment (.env file)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------
# Multipart File Upload Limits
# ---------------------------------------------------
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB
