# ===================================================
# 01Blog - Application Configuration
# ===================================================

# Server Port
server.port=8080

# ---------------------------------------------------
# Database Connection (PostgreSQL)
# ---------------------------------------------------
# JDBC URL format: jdbc:postgresql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:postgresql://localhost:5432/blog_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------
# JPA & Hibernate Settings
# ---------------------------------------------------
# 'update' automatically creates/updates database tables from our Java entities.
# This saves us from writing manual SQL table creation scripts!
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in the console so we can see what Hibernate is doing
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Ensure Jackson serializes JSON dates in UTC
spring.jackson.time-zone=UTC

# ---------------------------------------------------
# JWT (Security Token) Settings
# ---------------------------------------------------
# Secret key used to sign and verify JWT tokens (must be long and random)
app.jwt.secret=supersecretkey01blogmustbeatleast256bitslongforsecurity
# Token validity duration in milliseconds: 86400000 ms = 24 hours
app.jwt.expiration-ms=86400000
