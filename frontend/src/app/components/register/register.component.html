<div class="auth-page-wrapper">
  <div class="container py-3">
    <div class="row justify-content-center">
      <div class="col-12 col-md-11 col-lg-9 col-xl-8">

        <!-- Clean Brand Header -->
        <div class="d-flex align-items-center justify-content-between mb-3 px-1">
          <div class="d-flex align-items-center gap-2">
            <span class="fs-3 fw-bold font-display">01Blog<span class="text-primary">.</span></span>
            <span class="badge-nb badge-nb-yellow py-1 px-3">Zone01 Oujda</span>
          </div>
          <!-- Dark Mode Toggle -->
          <button
            (click)="themeService.toggleTheme()"
            class="btn-theme-toggle-auth"
            [title]="themeService.isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
            type="button"
          >
            <i class="bi" [ngClass]="themeService.isDarkMode ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill'"></i>
          </button>
        </div>

        <!-- Neo-Brutalist Register Card -->
        <div class="card-nb">
          
          <!-- Card Header -->
          <div class="card-nb-header py-3 px-4">
            <div class="d-flex align-items-center gap-3">
              <div class="header-icon-box">
                <i class="bi bi-person-plus-fill"></i>
              </div>
              <div>
                <h1 class="h5 mb-0 fw-bold font-display">Create Student Account</h1>
                <span class="text-muted small">Initialize your developer profile</span>
              </div>
            </div>
            <span class="badge-nb badge-nb-coral">Registration</span>
          </div>

          <!-- Card Body -->
          <div class="card-nb-body py-4 px-4">

            <!-- Error Banner -->
            <div *ngIf="errorMessage" class="alert-nb alert-nb-danger py-2 px-3 mb-3" role="alert">
              <i class="bi bi-exclamation-octagon-fill fs-5 mt-1"></i>
              <div>
                <span class="fw-bold me-1">Error:</span>
                <span>{{ errorMessage }}</span>
              </div>
            </div>

            <!-- Success Banner -->
            <div *ngIf="successMessage" class="alert-nb alert-nb-success py-2 px-3 mb-3" role="alert">
              <i class="bi bi-check-circle-fill fs-5 mt-1"></i>
              <div>
                <span class="fw-bold me-1">Success:</span>
                <span>{{ successMessage }}</span>
              </div>
            </div>

            <!-- Registration Form -->
            <form (ngSubmit)="onSubmit()" #regForm="ngForm">

              <div class="row g-3">
                <!-- Username Field -->
                <div class="col-12 col-md-6">
                  <div class="form-group-nb">
                    <label for="username" class="label-nb">
                      <i class="bi bi-at me-1"></i> Username
                    </label>
                    <input
                      type="text"
                      id="username"
                      name="username"
                      class="input-nb"
                      placeholder="e.g. richouan"
                      [(ngModel)]="username"
                      required
                      autocomplete="username"
                      [disabled]="isLoading"
                    />
                  </div>
                </div>

                <!-- Email Field -->
                <div class="col-12 col-md-6">
                  <div class="form-group-nb">
                    <label for="email" class="label-nb">
                      <i class="bi bi-envelope-fill me-1"></i> Email Address
                    </label>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      class="input-nb"
                      placeholder="richouan@zone01oujda.ma"
                      [(ngModel)]="email"
                      required
                      autocomplete="email"
                      [disabled]="isLoading"
                    />
                  </div>
                </div>

                <!-- Password Field -->
                <div class="col-12 col-md-6">
                  <div class="form-group-nb">
                    <label for="password" class="label-nb">
                      <i class="bi bi-lock-fill me-1"></i> Password
                    </label>
                    <input
                      type="password"
                      id="password"
                      name="password"
                      class="input-nb"
                      [class.input-nb-invalid]="isPasswordTouched() && !isPasswordValid()"
                      [class.input-nb-valid]="isPasswordTouched() && isPasswordValid()"
                      placeholder="••••••••••••"
                      [(ngModel)]="password"
                      required
                      minlength="6"
                      autocomplete="new-password"
                      [disabled]="isLoading"
                    />
                    <div *ngIf="isPasswordTouched()" class="mt-1">
                      <span *ngIf="!isPasswordValid()" class="text-danger small fw-semibold">
                        <i class="bi bi-x-circle-fill me-1"></i> Min 6 characters required
                      </span>
                      <span *ngIf="isPasswordValid()" class="text-success small fw-semibold">
                        <i class="bi bi-check-circle-fill me-1"></i> Valid password
                      </span>
                    </div>
                  </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="col-12 col-md-6">
                  <div class="form-group-nb">
                    <label for="confirmPassword" class="label-nb">
                      <i class="bi bi-shield-lock-fill me-1"></i> Confirm Password
                    </label>
                    <input
                      type="password"
                      id="confirmPassword"
                      name="confirmPassword"
                      class="input-nb"
                      [class.input-nb-invalid]="isConfirmPasswordTouched() && !isConfirmPasswordValid()"
                      [class.input-nb-valid]="isConfirmPasswordTouched() && isConfirmPasswordValid()"
                      placeholder="••••••••••••"
                      [(ngModel)]="confirmPassword"
                      required
                      autocomplete="new-password"
                      [disabled]="isLoading"
                    />
                    <div *ngIf="isConfirmPasswordTouched()" class="mt-1">
                      <span *ngIf="!isConfirmPasswordValid()" class="text-danger small fw-semibold">
                        <i class="bi bi-x-circle-fill me-1"></i> Passwords do not match
                      </span>
                      <span *ngIf="isConfirmPasswordValid()" class="text-success small fw-semibold">
                        <i class="bi bi-check-circle-fill me-1"></i> Passwords match
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="mt-4">
                <button
                  type="submit"
                  class="btn-nb-primary w-100 py-3"
                  [disabled]="isLoading || !username || !email || !isPasswordValid() || !isConfirmPasswordValid()"
                >
                  <span *ngIf="!isLoading" class="d-inline-flex align-items-center gap-2">
                    <span class="fs-6">Create Your Account</span>
                    <i class="bi bi-arrow-right"></i>
                  </span>
                  <span *ngIf="isLoading" class="d-inline-flex align-items-center gap-2">
                    <span class="spinner-border spinner-border-sm" role="status"></span>
                    <span>Creating Profile...</span>
                  </span>
                </button>
              </div>

            </form>

            <!-- Card Footer Switch to Login -->
            <div class="d-flex align-items-center justify-content-between mt-4 pt-3 border-top border-2 border-dark border-opacity-10">
              <span class="text-muted">Already registered?</span>
              <a routerLink="/login" class="btn-nb-secondary text-decoration-none py-2 px-3">
                <span>Sign In</span>
                <i class="bi bi-box-arrow-in-right"></i>
              </a>
            </div>

          </div>
          <!-- /Card Body -->

        </div>
        <!-- /Neo-Brutalist Card -->

      </div>
    </div>
  </div>
</div>
